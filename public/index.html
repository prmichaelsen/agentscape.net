    :root {
      color-scheme: light dark;
      --fg: #111;

    @media (prefers-color-scheme: dark) {
      :root { --fg: #eee; --muted: #aaa; --bg: #111; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);

    main {

      margin: 0 auto;
      padding: 4rem 1.5rem;

      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
      letter-spacing: -0.01em;
    }

      color: var(--muted);
      font-style: italic;
      margin: 0 0 2rem;
    }
    p.spine {
      font-size: 1.125rem;
      margin: 0 0 2rem;
    }
    .status {
      border-top: 1px solid var(--muted);
      padding-top: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    a { color: inherit; }
  </style>
</head>
